[package]
name = "mir-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Low-level FFI bindings to the Mir compositor's miral C++ library"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mir", "wayland", "compositor", "ffi", "bindings"]
categories = ["external-ffi-bindings", "gui"]
links = "miral"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = { version = ">=1.0.167" }

[build-dependencies]
cxx-build = { version = ">=1.0.167" }
bindgen = "0.71"
pkg-config = "0.3"
