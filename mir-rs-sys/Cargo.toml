[package]
name = "mir-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Low-level FFI bindings to the Mir compositor's miral C++ library"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mir", "wayland", "compositor", "ffi", "bindings"]
categories = ["external-ffi-bindings", "gui"]
links = "miral"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Experimental: exposes the surface transform, which requires linking against
# `mirserver` (via the `mirserver-internal` headers). This is a temporary
# "necessary evil" — the underlying `mir::scene::Surface::transform` is expected
# to disappear in a future Mir release. Off by default.
experimental = []

[dependencies]
# Upper-bounded below 1.0.195: from that release cxx declares rust-version 1.85
# (and cxxbridge-macro moved to edition 2024), which would break the 1.82.0 MSRV.
cxx = { version = ">=1.0.167, <1.0.195" }

[build-dependencies]
# Must match the cxx version; capped below 1.0.195 for the same rust-version 1.85
# / MSRV reason as the cxx dependency above.
cxx-build = { version = ">=1.0.167, <1.0.195" }
bindgen = "0.71"
pkg-config = "0.3"
