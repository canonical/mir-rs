name: Publish

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Kept in lockstep with rust-version in the workspace manifest (Cargo.toml).
  RUST_VERSION: '1.85.0'

jobs:
  prepare:
    name: Resolve release tag and validate version
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_repository.fork == false }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.tag.outputs.should_publish }}
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Check out the repository at the CI commit
        # v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release tag and validate crate version
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          mapfile -t release_tags < <(git tag --points-at "$HEAD_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)

          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo 'No vMAJOR.MINOR.PATCH tag on this successful CI commit; skipping publish.'
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#release_tags[@]}" -gt 1 ]; then
            echo "Expected exactly one release tag, found: ${release_tags[*]}"
            exit 1
          fi

          release_tag="${release_tags[0]}"
          tag_version="${release_tag#v}"
          crate_version="$(
            python3 - <<'PY'
import pathlib
import sys
import tomllib

workspace = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
crate = tomllib.loads(pathlib.Path("mir-rs/Cargo.toml").read_text())
package = crate.get("package", {})
version = package.get("version")

if isinstance(version, str):
    print(version)
    sys.exit(0)

if isinstance(version, dict) and version.get("workspace") is True:
    print(workspace["workspace"]["package"]["version"])
    sys.exit(0)

print("Could not resolve mir crate version from Cargo.toml metadata", file=sys.stderr)
sys.exit(1)
PY
          )"

          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "Tag version '$tag_version' does not match crate version '$crate_version'"
            exit 1
          fi

          echo "Resolved release tag: $release_tag"
          echo 'should_publish=true' >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish mir crate
    needs: [prepare]
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository at the release commit
        # v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Add the mir-team development PPA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:mir-team/dev
          sudo apt-get update

      - name: Install Mir development libraries and build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            libmiral-dev \
            libmircore-dev \
            libmircommon-dev \
            libclang-dev \
            clang \
            pkg-config \
            build-essential

      - name: Install the Rust toolchain via rustup
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Authenticate with crates.io via trusted publishing
        id: crates_io
        # v1.0.5
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish mir crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io.outputs.token }}
        run: cargo publish -p mir --locked
