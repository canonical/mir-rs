name: CI

on:
  push:
  pull_request:
  schedule:
    # 03:17 UTC every day. The dev PPA is a moving target, so this re-pulls it
    # and rebuilds against whatever Mir is current.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect_rust_version:
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.detect.outputs.rust_version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read rust-version from workspace Cargo.toml
        id: detect
        run: |
          set -euo pipefail
          rust_version="$(awk -F'\"' '/^rust-version *= *\"/{print $2; exit}' Cargo.toml)"
          if [ -z "${rust_version}" ]; then
            echo "Could not determine rust-version from Cargo.toml"
            exit 1
          fi
          echo "rust_version=${rust_version}" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: [detect_rust_version]
    uses: ./.github/workflows/build-and-test.yml
    with:
      rust_version: ${{ needs.detect_rust_version.outputs.rust_version }}

  report-nightly-status:
    needs: [build-and-test]
    # Only the scheduled (nightly) run touches the tracking issue. A push/PR
    # failure already surfaces on the commit or PR, so filing an issue for those
    # would just be noise. The dev PPA is a moving target, so a nightly break is
    # usually a new Mir landing that we need to react to. This runs on both
    # success and failure so it can open the issue on a break and close it again
    # once the build recovers.
    if: ${{ (github.event_name == 'push' && needs.build-and-test.result == 'success') || github.event_name == 'schedule' }}
    uses: ./.github/workflows/report-nightly-status.yml
    with:
      build_result: ${{ needs.build-and-test.result }}
    secrets: inherit

  publish:
    needs: [build-and-test]
    if: ${{ github.event_name == 'push' && needs.build-and-test.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ github.ref_name }}
      head_sha: ${{ github.sha }}
