name: Build and test

on:
  workflow_call:
    inputs:
      rust_version:
        description: Rust toolchain version to install
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build-and-test:
    name: Build & test against ppa:mir-team/dev
    # Pinned to 26.04 rather than ubuntu-latest: the bridge needs miral >= 6.0,
    # and ppa:mir-team/dev only publishes that for resolute (26.04) and newer.
    # ubuntu-latest is still noble (24.04), where the PPA tops out at miral 5.8.
    # 26.04 is a preview runner image today - move back to ubuntu-latest once
    # 26.04 is GA.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add the mir-team development PPA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:mir-team/dev
          sudo apt-get update

      - name: Install Mir development libraries and build dependencies
        run: |
          # Mir libraries come from ppa:mir-team/dev; the rest are the toolchain
          # the build needs — libclang for bindgen, pkg-config for build.rs's
          # probes, and a C++ compiler for the cxx bridge.
          sudo apt-get install -y --no-install-recommends \
            libmiral-dev \
            libmircore-dev \
            libmircommon-dev \
            libclang-dev \
            clang \
            pkg-config \
            build-essential

      - name: Report the installed Mir versions
        run: |
          pkg-config --modversion miral mircore mircommon || true

      - name: Install the Rust toolchain via rustup
        env:
          RUST_VERSION: ${{ inputs.rust_version }}
        run: |
          # ubuntu-latest ships rustup, but not necessarily the version this
          # workspace declares - install rustup if it is missing, then pin the
          # toolchain to rust-version from the workspace manifest.
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "${RUST_VERSION}"
          rustc --version
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ inputs.rust_version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ inputs.rust_version }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the test suite
        run: cargo test --workspace

      - name: Build the tiling example
        run: cargo build -p mir-rs-tiling
